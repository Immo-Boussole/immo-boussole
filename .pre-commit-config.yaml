repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: .pre-commit-config.yaml

  - repo: local
    hooks:
      - id: no-sensitive-strings
        name: Block sensitive personal data in commits
        language: python
        entry: python scripts/check_no_sensitive_data.py
        types: [text]
